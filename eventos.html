initTheme();

const SUPABASE_URL = "https://irykmyygquytxezevlas.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyeWtteXlncXV5dHhlemV2bGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTY0ODgsImV4cCI6MjEwMDM5MjQ4OH0.8WfJ_uc4nT1p8tX4fcfYKwdmF7wwL5QGa8KfKyNMSfs";

let loggedInPlayerName = null;

async function doGateLogin(){
  const name = document.getElementById('gateNameSelect').value;
  const password = document.getElementById('gatePassword').value;
  const errEl = document.getElementById('gateError');
  errEl.style.display = 'none';
  if(!name){ errEl.textContent = 'Selecione o seu nome.'; errEl.style.display='block'; return; }
  if(!password){ errEl.textContent = 'Escreva a sua password.'; errEl.style.display='block'; return; }
  const result = await verifyPlayerLogin(SUPABASE_URL, SUPABASE_ANON_KEY, name, password);
  if(!result.ok){
    errEl.textContent = result.reason==='notfound' ? 'Este jogador ainda não foi registrado pelo organizador.'
      : result.reason==='wrongpass' ? 'Password incorreta.'
      : 'Erro ao ligar à base de dados.';
    errEl.style.display = 'block';
    return;
  }
  localStorage.setItem('player_login_name', name);
  loggedInPlayerName = name;
  unlockContent();
}

function unlockContent(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('loggedInNameTop').textContent = loggedInPlayerName;
  init();
}

function doPlayerLogout(){
  localStorage.removeItem('player_login_name');
  endPlayerSession(SUPABASE_URL, SUPABASE_ANON_KEY);
  loggedInPlayerName = null;
  document.getElementById('gatePassword').value = '';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';
}

async function pageBoot(){
  const sel = document.getElementById('gateNameSelect');
  try{
    const names = await fetchRegisteredPlayerNames(SUPABASE_URL, SUPABASE_ANON_KEY);
    sel.innerHTML = '<option value="">— selecione o seu nome —</option>';
    names.forEach(n=>{
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      sel.appendChild(opt);
    });
    const saved = localStorage.getItem('player_login_name');
    if(saved && names.includes(saved)){
      loggedInPlayerName = saved;
      unlockContent();
    }
  } catch(e){
    sel.innerHTML = '<option value="">— erro ao carregar jogadores —</option>';
  }
}

function sbHeaders(){
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
}
function setStatus(ok, text){
  document.getElementById('statusDot').className = 'status-dot ' + (ok?'on':'off');
  document.getElementById('statusText').textContent = text;
}

let dailyBonusClaimInFlight = false;
async function handleDailyBonusClick(){
  if(dailyBonusClaimInFlight) return;
  dailyBonusClaimInFlight = true;
  const icon = document.getElementById('dailyBonusIcon');
  if(icon) icon.classList.remove('available');
  try{
    const result = await claimDailyBonus(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName);
    if(result.awarded){
      showCelebrationToast(`🎁 Bônus diário de login: +${result.amount} 🪙<br><span style="font-size:11px;opacity:0.85;">Sequência: dia ${result.streak}${result.streak>=7?' (máximo)':''}</span>`);
      refreshMyCoins();
    }
  } finally {
    dailyBonusClaimInFlight = false;
  }
}

// ---------- Estado da página ----------
let activeEvent = null;   // linha da tabela events
let mod = null;           // definição do evento (eventos/<slug>.js)
let ctx = null;           // dados do jogador neste evento (EventCore.load)
let myProfile = {};
let activeTab = 'passaporte';
const X1_ENABLED = true;  // desafios x1 ligados (se a tabela x1_challenges não existir, o separador some sozinho)
// Estado só de interface (sobrevive aos re-desenhos): sanfonas abertas, rascunho do postal, animações já feitas.
const ui = { open: {}, draft: '', justClaimed: null, routeAnimated: false, intro: true, fresh: new Set() };
const evApi = () => ({ ui, x1On: X1_ENABLED && !!ctx && ctx.x1Available !== false });
// Separadores visíveis: o dos x1 só existe se estiver ligado e a tabela existir.
const visibleTabs = () => mod.tabs.filter(t => !t.needs || (t.needs === 'x1' && evApi().x1On) || (t.needs === 'shop' && !!ctx && !!ctx.shop && ctx.shop.available))
  .concat(pastEvents.length ? [historyTab] : []);   // o separador "Histórico" é comum a todos os eventos e só aparece se houver eventos anteriores

// Versão dos ficheiros do evento (showdown-utils.js, eventos-core.js e eventos/<slug>.*): MUDAR (aqui e nas
// duas <script src="...?v="> lá em cima) sempre que algum deles mudar, para o browser não misturar ficheiros
// novos com versões antigas em cache.
const EV_ASSET_VERSION = '20261012j';

// Carrega o CSS e o JS do evento ativo (cada evento tem o seu par). O slug só pode ter a-z, 0-9 e "-".
function loadEventAssets(slug){
  return new Promise((resolve, reject) => {
    if(!/^[a-z0-9-]+$/.test(slug)){ reject(new Error('slug inválido')); return; }
    if((window.EVENT_MODULES || {})[slug]){ resolve(); return; }   // já carregado
    const css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = `eventos/${slug}.css?v=${EV_ASSET_VERSION}`;
    document.head.appendChild(css);
    const js = document.createElement('script');
    js.src = `eventos/${slug}.js?v=${EV_ASSET_VERSION}`;
    js.onload = () => resolve();
    js.onerror = () => reject(new Error('módulo do evento não encontrado'));
    document.head.appendChild(js);
  });
}

// ---------- Histórico: eventos anteriores ----------
// Só aparecem os eventos terminados que ACONTECERAM (alguém reclamou missões ou há um torneio com campeão): um evento criado por engano não conta.
let pastEvents = [];   // [{ ev, ranking:[{name,xp,miles}], champs:[{week,region,champion}] }]
const historyTab = { key:'historico', icon:'📚', label:'Histórico', render: () => `<section class="evh-wrap"><h3 class="evh-title">📚 Eventos anteriores</h3>${renderPastEvents()}</section>` };

async function loadPastEvents(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/events?status=eq.ended&select=*&order=created_at.desc&limit=30`, { headers: sbHeaders() });
    if(!res.ok) return [];
    const evs = await res.json();
    if(!evs.length) return [];
    const ids = evs.map(e => e.id).join(',');
    const cres = await fetch(`${SUPABASE_URL}/rest/v1/event_claims?event_id=in.(${ids})&select=event_id,player_name,xp,currency&limit=5000`, { headers: sbHeaders() });
    const claims = cres.ok ? await cres.json() : [];
    const tours = await Promise.all(evs.map(e => fetchEventTournaments(SUPABASE_URL, SUPABASE_ANON_KEY, e.id)));
    return evs.map((ev, i) => {
      const map = {};
      claims.filter(c => c.event_id === ev.id).forEach(c => {
        const r = map[c.player_name] || (map[c.player_name] = { name: c.player_name, xp: 0, miles: 0 });
        r.xp += c.xp || 0; r.miles += c.currency || 0;
      });
      const ranking = Object.values(map).sort((a, b) => b.xp - a.xp || b.miles - a.miles || a.name.localeCompare(b.name));
      const champs = tours[i].filter(t => t.data.event && t.data.champion)
        .map(t => ({ week: t.data.event.week, region: t.data.event.region, champion: t.data.champion })).sort((a, b) => a.week - b.week);
      return { ev, ranking, champs };
    }).filter(p => p.ranking.length || p.champs.length);
  } catch(e){ return []; }
}

function renderPastEvents(){
  if(!pastEvents.length) return '';
  const fmt = d => d ? new Date(d).toLocaleDateString('pt-PT', { day:'numeric', month:'short', year:'numeric' }) : '—';
  const medals = ['🥇', '🥈', '🥉'];
  return '<div class="evh">' + pastEvents.map(p => {
    const ev = p.ev, m = (window.EVENT_MODULES || {})[ev.slug];
    const champs = p.champs.map(c => `<span class="evh-chip">Semana ${c.week} · ${escapeHtml(EVENT_REGIONS[c.region] ? EVENT_REGIONS[c.region].label : c.region)}: <b>${escapeHtml(c.champion)}</b> 🏆</span>`).join('');
    const rows = p.ranking.slice(0, 5).map((r, i) => `<div class="evh-row${r.name === loggedInPlayerName ? ' me' : ''}">
        <span class="evh-pos">${medals[i] || (i + 1)}</span><span class="evh-who">${escapeHtml(r.name)}</span>
        ${m ? `<span class="evh-lvl">Nível ${EventCore.levelFor(m, r.xp).level}</span>` : ''}<span class="evh-xp">${r.xp} XP</span></div>`).join('');
    return `<div class="evh-card">
      <div class="evh-head"><span class="evh-name">🌍 ${escapeHtml(ev.name)}</span><span class="evh-dates">${fmt(ev.starts_at || ev.created_at)} → ${fmt(ev.ends_at)}</span>
        <span class="evh-pill">${ev.current_week}/${ev.total_weeks} semanas · ${p.ranking.length} jogador${p.ranking.length === 1 ? '' : 'es'}</span></div>
      ${champs ? `<div class="evh-sub">Campeões de cada semana</div><div class="evh-champs">${champs}</div>` : ''}
      ${rows ? `<div class="evh-sub">Pódio do evento (XP)</div>${rows}` : ''}
    </div>`;
  }).join('') + '</div>';
}

async function refreshMyCoins(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/players?name=eq.${encodeURIComponent(loggedInPlayerName)}&select=coins`, { headers: sbHeaders() });
    const rows = await res.json();
    if(rows && rows[0]) document.getElementById('myCoinsDisplay').textContent = `🪙 ${rows[0].coins || 0}`;
  } catch(e){}
}

async function init(){
  EventCore.init(SUPABASE_URL, SUPABASE_ANON_KEY);
  const root = document.getElementById('eventRoot');
  // Depois de uma atualização do site, o browser pode ainda ter em cache o showdown-utils.js antigo
  // (sem as funções do evento). Em vez de um erro genérico, diz o que fazer.
  if(typeof fetchEventTournaments !== 'function' || typeof grantCosmetic !== 'function' || !EventCore.board || !EventCore.x1 || !EventCore.shop || typeof EventCore.x1.leaders !== 'function' || typeof nameFxClass !== 'function' || !getCosmeticById('frame_vm_esquadrilha') || !getCosmeticById('frame_vm_balao')){
    setStatus(false, 'Ficheiros antigos em cache.');
    root.innerHTML = '<div class="card"><div class="empty-state">O teu browser ainda tem ficheiros antigos do site em cache. Faz <b>Ctrl+F5</b> para atualizar e abre esta página outra vez.</div></div>';
    return;
  }
  try{
    const [profiles, ev, past] = await Promise.all([
      fetchPlayerProfiles(SUPABASE_URL, SUPABASE_ANON_KEY),
      fetchActiveEvent(SUPABASE_URL, SUPABASE_ANON_KEY),
      loadPastEvents()
    ]);
    pastEvents = past;
    myProfile = profiles[loggedInPlayerName] || {};
    document.getElementById('playerCornerContainer').innerHTML = renderPlayerCornerBadge(loggedInPlayerName, profiles[loggedInPlayerName]);
    checkDailyBonusAvailable(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName).then(available=>{
      document.getElementById('playerCornerContainer').insertAdjacentHTML('beforeend', renderDailyBonusIcon(available));
    });
    document.getElementById('myCoinsDisplay').textContent = `🪙 ${myProfile.coins || 0}`;

    if(!ev){
      setStatus(true, 'Ligado — não há nenhum evento ativo.');
      // para mostrar o nível de cada jogador nos eventos anteriores é preciso o módulo desse evento (se não carregar, mostra só o XP)
      await Promise.all([...new Set(pastEvents.map(p => p.ev.slug))].map(s => loadEventAssets(s).catch(() => {})));
      root.innerHTML = '<div class="card"><h2>🌍 Eventos</h2><div class="empty-state">Não há nenhum evento ativo de momento. Quando houver, aparece aqui — com missões, níveis e prémios exclusivos.</div></div>'
        + (pastEvents.length ? `<div class="card" style="margin-top:14px;"><h3 class="evh-title">📚 Eventos anteriores</h3>${renderPastEvents()}</div>` : '');
      return;
    }
    activeEvent = ev;
    await loadEventAssets(ev.slug);
    mod = (window.EVENT_MODULES || {})[ev.slug];
    if(!mod) throw new Error('módulo do evento em falta');
    root.className = 'ev-theme-' + ev.slug;
    document.body.classList.add('ev-body-' + ev.slug);   // céu e cores do evento (CSS do módulo)

    ctx = await EventCore.load(ev, loggedInPlayerName);
    ctx.playerNames = Object.keys(profiles);
    setStatus(true, `Ligado — ${ev.name}: semana ${ev.current_week} de ${ev.total_weeks}.`);
    renderAll();
    await syncRewards();
  } catch(e){
    console.error(e);
    setStatus(false, 'Não foi possível carregar o evento.');
    root.innerHTML = '<div class="card"><div class="empty-state">Não foi possível carregar o evento. Tenta recarregar a página.</div></div>';
  }
}

// ---------- Renderização ----------
// Os separadores e o seu conteúdo vêm do módulo do evento (mod.tabs).
function renderAll(){
  captureDraft();
  const root = document.getElementById('eventRoot');
  const a = evApi();
  const tabs = visibleTabs();
  if(!tabs.some(t => t.key === activeTab)) activeTab = tabs[0].key;
  const tabsHtml = `<div class="ev-tabs" role="tablist">` + tabs.map(t => {
    const badge = t.badge ? t.badge(ctx, a) : 0;
    return `<button class="ev-tab${t.key === activeTab ? ' active' : ''}" role="tab" onclick="switchEventTab('${t.key}')"><span class="ico">${t.icon}</span>${t.label}${badge ? `<span class="badge">${badge}</span>` : ''}</button>`;
  }).join('') + `</div>`;
  root.innerHTML = tabsHtml + tabs.map(t => `<div id="panel-${t.key}" class="shop-panel${t.key === activeTab ? ' active' : ''}">${t.render(ctx, a)}</div>`).join('');
  document.body.dataset.evRegion = mod.currentRegion(ctx);
  if(mod.afterRender) mod.afterRender(activeTab, root, ctx, ui);
  ui.intro = false;
}

function switchEventTab(tab){
  activeTab = tab;
  liveLast.board = 0; liveLast.x1 = 0;   // ao abrir o separador, atualiza logo (no próximo ciclo)
  const tabs = visibleTabs();
  document.querySelectorAll('#eventRoot .ev-tab').forEach((b, i) => b.classList.toggle('active', tabs[i].key === tab));
  document.querySelectorAll('#eventRoot .shop-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));
  if(mod.afterRender) mod.afterRender(tab, document.getElementById('eventRoot'), ctx, ui);
}

function evToggle(key, open){ ui.open[key] = open; }
function captureDraft(){ const t = document.getElementById('evDraft'); if(t) ui.draft = t.value; }
function evDraftInput(el){
  ui.draft = el.value;
  const c = document.getElementById('evCount');
  if(c) c.textContent = `${el.value.length}/${EventCore.board.MAX_LEN}`;
}

// ---------- Ações ----------
async function doClaim(missionId, btn){
  const mission = EventCore.expandMissions(mod, activeEvent, { x1: X1_ENABLED }, ctx).find(m => m.id === missionId);
  if(!mission) return;
  if(btn) btn.disabled = true;
  const levelBefore = EventCore.levelFor(mod, EventCore.totals(ctx, loggedInPlayerName).xp).level;
  const r = await EventCore.claimMission(ctx, mission);
  if(r.ok){
    showCelebrationToast(`🎫 Missão cumprida: <b>${escapeHtml(mission.title)}</b><br><span style="font-size:11px;opacity:0.9;">+${r.rewards.xp} XP · ${mod.currency.emoji} ${r.rewards.miles}${r.rewards.coins ? ' · 🪙 ' + r.rewards.coins : ''}</span>`, 5500);
    refreshMyCoins();
    ui.justClaimed = missionId;
    renderAll();
    ui.justClaimed = null;
    if(mod.celebrate) mod.celebrate(document.querySelector(`.vm-pass[data-mid="${missionId}"] .vm-claimed`), 'claim');
    const levelAfter = EventCore.levelFor(mod, EventCore.totals(ctx, loggedInPlayerName).xp).level;
    if(levelAfter > levelBefore){
      setTimeout(() => {
        showCelebrationToast(`⬆️ Subiste para o <b>nível ${levelAfter}</b>!`, 5500);
        if(mod.celebrate) mod.celebrate({ getBoundingClientRect: () => ({ left: window.innerWidth / 2, top: window.innerHeight / 3, width: 0, height: 0 }) }, 'level');
      }, 700);
    }
    await syncRewards();
  } else {
    const msg = r.reason === 'already' ? 'Esta missão já tinha sido reclamada.'
      : r.reason === 'notdone' ? 'Ainda não cumpriste esta missão.'
      : r.reason === 'payment' ? 'Não consegui pagar as moedas — a missão NÃO foi marcada como reclamada. Tenta outra vez.'
      : r.reason === 'busy' ? '' : 'Não foi possível reclamar agora. Tenta outra vez.';
    if(msg) alert(msg);
    renderAll();
  }
}

async function doPostCard(btn){
  captureDraft();
  if(btn) btn.disabled = true;
  const r = await EventCore.board.post(ctx, ui.draft);
  if(r.ok){
    ui.draft = '';
    showCelebrationToast('📮 Postal enviado! Já está no quadro do evento.', 4500);
    renderAll();
    return;
  }
  const msg = r.reason === 'empty' ? 'Escreve alguma coisa antes de enviar.'
    : r.reason === 'toolong' ? `O postal só pode ter ${EventCore.board.MAX_LEN} caracteres.`
    : r.reason === 'already' ? 'Já deixaste o teu postal de hoje — volta amanhã!'
    : r.reason === 'unavailable' ? 'O quadro ainda não está disponível.'
    : 'Não foi possível enviar agora. Tenta outra vez.';
  alert(msg);
  if(r.reason === 'already') renderAll(); else if(btn) btn.disabled = false;
}

async function doReact(messageId, emojiIdx){
  const emoji = mod.board.emojis[emojiIdx];
  if(!emoji) return;
  await EventCore.board.react(ctx, messageId, emoji);
  renderAll();
}

// ---------- Loja de Milhas ----------
async function doShopBuy(itemId, btn){
  const it = ctx.shop.items.find(x => x.item_id === itemId);
  const c = getCosmeticById(itemId);
  if(!it || !c) return;
  if(!confirm(`Comprar "${c.name}" por ${mod.currency.emoji} ${it.cost} ${mod.currency.name}?\n\nFica no teu perfil para sempre (equipa-o em Perfil → Customizar). As ${mod.currency.name} gastas não voltam.`)) return;
  if(btn) btn.disabled = true;
  const r = await EventCore.shop.buy(ctx, itemId);
  if(r.ok){
    if(!(myProfile.ownedCosmetics || []).includes(itemId)) myProfile.ownedCosmetics = (myProfile.ownedCosmetics || []).concat([itemId]);
    showCelebrationToast(`🛍️ Comprado: <b>${escapeHtml(c.name)}</b><br><span style="font-size:11px;opacity:0.9;">Equipa-o em Perfil → Customizar · sobram ${mod.currency.emoji} ${r.balance}</span>`, 6500);
    renderAll();
    if(mod.celebrate) mod.celebrate(document.querySelector(`.vm-shop-item[data-item="${itemId}"]`), 'claim');
    return;
  }
  if(r.reason === 'auth' || r.reason === 'busy') return;   // 'auth': a página recarrega sozinha para entrar outra vez
  const msg = r.reason === 'insufficient' ? `Não tens ${mod.currency.name} suficientes${r.balance != null ? ` (tens ${r.balance})` : ''}.`
    : r.reason === 'alreadyowned' ? 'Já tens esta lembrança.'
    : r.reason === 'closed' ? 'A loja fechou: o evento já terminou.'
    : r.reason === 'noitem' ? 'Esta lembrança já não está à venda.'
    : 'Não foi possível comprar agora. Tenta outra vez.';
  alert(msg);
  try{ await EventCore.refresh(ctx); } catch(e){ /* sem rede: mantém o que já temos */ }
  renderAll();
}

// ---------- Desafios x1 ----------
async function doX1Send(btn){
  const sel = document.getElementById('x1Opponent');
  const opp = sel ? sel.value : '';
  if(!opp){ alert('Escolhe o adversário.'); return; }
  if(btn) btn.disabled = true;
  const r = await EventCore.x1.send(ctx, opp);
  if(r.ok){
    showCelebrationToast(`⚔️ Desafio enviado a <b>${escapeHtml(opp)}</b>! Quando aceitar, combinem o jogo no Showdown.`, 5000);
  } else {
    const msg = r.reason === 'quota' ? `Já enviaste os ${EventCore.x1.MAX_PER_WEEK} desafios desta semana.`
      : r.reason === 'dup' ? 'Já desafiaste este jogador esta semana — escolhe outro.'
      : r.reason === 'noweek' ? 'Os desafios abrem com o torneio da Semana 1.'
      : r.reason === 'self' ? 'Não te podes desafiar a ti próprio.'
      : r.reason === 'noname' ? 'Escolhe o adversário.' : 'Não foi possível enviar agora. Tenta outra vez.';
    alert(msg);
  }
  renderAll();
}

async function doX1Act(id, act, btn){
  const row = EventCore.x1.get(ctx, id);
  if(!row) return;
  const other = row.challenger_name === loggedInPlayerName ? row.opponent_name : row.challenger_name;
  let r;
  if(act === 'accept')       r = await EventCore.x1.respond(ctx, id, true);
  else if(act === 'decline'){ if(!confirm(`Recusar o desafio de ${other}?`)) return; r = await EventCore.x1.respond(ctx, id, false); }
  else if(act === 'cancel'){  if(!confirm(`Cancelar o desafio a ${other}?`)) return;  r = await EventCore.x1.cancel(ctx, id); }
  else if(act === 'win' || act === 'lose'){
    const rpInput = document.getElementById('x1rp-' + id);
    const replayUrl = rpInput ? rpInput.value : '';
    if(EventCore.x1.cleanReplayUrl(replayUrl) === null){ alert('O link do replay tem de ser do Showdown, assim: https://replay.pokemonshowdown.com/…  (ou deixa em branco).'); return; }
    if(!confirm(act === 'win' ? `Confirmas que GANHASTE contra ${other}?` : `Confirmas que PERDESTE contra ${other}?`)) return;
    r = await EventCore.x1.report(ctx, id, act === 'win' ? loggedInPlayerName : other, replayUrl);
  }
  else if(act === 'confirm')  r = await EventCore.x1.confirm(ctx, id);
  else if(act === 'dispute'){ const note = prompt(`Porque contestas o resultado de ${row.reported_by}? (opcional — o organizador vai decidir)`); if(note === null) return; r = await EventCore.x1.dispute(ctx, id, note); }
  else return;
  if(btn) btn.disabled = true;
  if(r.ok){
    const t = { accept:'✔ Desafio aceite — combinem o jogo e registem o resultado.', decline:'Desafio recusado.', cancel:'Desafio cancelado.',
                win:`🏆 Vitória registada — falta ${other} confirmar.`, lose:`Resultado registado — falta ${other} confirmar.`,
                confirm:'✔ Resultado confirmado!', dispute:'⚠ Contestado — o organizador vai decidir.' }[act];
    showCelebrationToast(t, 4500);
  } else if(r.reason === 'changed'){
    alert('Este desafio foi alterado entretanto (a outra pessoa foi mais rápida). Atualizei a lista.');
  } else {
    alert('Não foi possível concluir agora. Tenta outra vez.');
  }
  renderAll();
}

async function doX1Replay(id, btn){
  const input = document.getElementById('x1rp-' + id);
  const url = input ? input.value : '';
  if(!EventCore.x1.cleanReplayUrl(url)){ alert('Cola um link do Showdown, assim: https://replay.pokemonshowdown.com/…'); return; }
  if(btn) btn.disabled = true;
  const r = await EventCore.x1.addReplay(ctx, id, url);
  if(r.ok) showCelebrationToast('▶ Replay juntado ao desafio!', 4000);
  else if(r.reason === 'changed' || r.reason === 'notyet') alert('Este desafio já tem replay ou mudou entretanto. Atualizei a lista.');
  else alert('Não foi possível juntar o replay agora. Tenta outra vez.');
  renderAll();
}

// ---------- Atualização ao vivo ----------
// Quadro: de 5 em 5 s (só com o separador aberto); x1: de 10 em 10 s (idem); o resto do evento (ranking, missões,
// torneios...): de 45 em 45 s. Só pede dados com a página visível, só desenha se algo mudou e NUNCA enquanto estás
// a escrever num campo (fica pendente e desenha quando saíres dele).
const LIVE_EVERY = { board: 5000, x1: 10000, all: 45000 };
const liveLast = { board: 0, x1: 0, all: Date.now() };
let liveBusy = false, livePending = false;

function typingInEvent(){
  const a = document.activeElement;
  return !!(a && ['TEXTAREA', 'INPUT', 'SELECT'].includes(a.tagName) && document.getElementById('eventRoot').contains(a));
}
function liveRender(){
  if(typingInEvent()){ livePending = true; return; }
  livePending = false;
  renderAll();
}
document.addEventListener('focusout', () => setTimeout(() => { if(livePending && !typingInEvent()) liveRender(); }, 300));
function markFresh(ids){
  ids.forEach(id => { ui.fresh.add(id); setTimeout(() => ui.fresh.delete(id), 7000); });
}

async function liveTick(){
  if(document.hidden || !ctx || liveBusy) return;
  if(livePending && !typingInEvent()) liveRender();   // rede de segurança caso o "focusout" não tenha chegado
  const now = Date.now();
  liveBusy = true;
  try{
    let changed = false;
    if(now - liveLast.all >= LIVE_EVERY.all){
      liveLast.all = liveLast.board = liveLast.x1 = now;
      const sig = EventCore.signature(ctx), had = new Set(ctx.board.messages.map(m => m.id));
      await EventCore.refresh(ctx);
      markFresh(ctx.board.messages.filter(m => !had.has(m.id) && m.author_name !== loggedInPlayerName).map(m => m.id));
      changed = EventCore.signature(ctx) !== sig;
    } else {
      if(activeTab === 'quadro' && now - liveLast.board >= LIVE_EVERY.board){
        liveLast.board = now;
        const r = await EventCore.board.live(ctx);
        markFresh(r.newIds);
        if(r.changed) changed = true;
      }
      if(activeTab === 'x1' && evApi().x1On && now - liveLast.x1 >= LIVE_EVERY.x1){
        liveLast.x1 = now;
        const sig = EventCore.signature(ctx);
        await EventCore.x1.refresh(ctx);
        if(EventCore.signature(ctx) !== sig) changed = true;
      }
    }
    if(changed) liveRender();
  } catch(e){ /* sem rede por um momento: tenta outra vez no próximo ciclo */ }
  finally { liveBusy = false; }
}
setInterval(liveTick, 2500);
document.addEventListener('visibilitychange', () => { if(!document.hidden) liveTick(); });

// Garante os cosméticos de todos os níveis já atingidos e avisa dos novos.
async function syncRewards(){
  const added = await EventCore.syncLevelRewards(ctx, mod, myProfile.ownedCosmetics);
  if(!added.length) return;
  myProfile.ownedCosmetics = (myProfile.ownedCosmetics || []).concat(added);
  added.forEach((id, i) => {
    setTimeout(() => showCelebrationToast(`🏅 Prémio de nível desbloqueado!<br><b>${escapeHtml(mod.cosmeticName(id))}</b><br><span style="font-size:11px;opacity:0.9;">Equipa-o em Perfil → Customizar</span>`, 7000), 1400 + i * 900);
  });
}
