<style>
.customize-toggle-btn{
  background:var(--bg-card);border:1px solid var(--line);color:var(--tera-cyan);padding:9px 16px;
  border-radius:8px;font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:13px;cursor:pointer;margin-top:12px;
}
.customize-toggle-btn:hover{border-color:var(--tera-cyan);}

.profile-head{display:flex;align-items:center;gap:16px;margin-bottom:6px;flex-wrap:wrap;}
.profile-avatar{
  width:56px;height:56px;border-radius:14px;flex-shrink:0;
  background:linear-gradient(135deg,var(--tera-violet),var(--tera-cyan));
  display:flex;align-items:center;justify-content:center;font-family:'Chakra Petch',sans-serif;
  font-size:22px;font-weight:700;color:#0a0c14;
}
.profile-name{font-family:'Chakra Petch',sans-serif;font-size:22px;font-weight:700;}
.profile-champion-line{font-size:12.5px;color:var(--tera-amber);margin-top:2px;}
.special-tag-chip{
  display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,rgba(165,107,240,0.18),rgba(79,216,208,0.18));
  border:1px solid rgba(165,107,240,0.4);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:600;color:var(--text-main);
}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:16px 0;}
.stat-box{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:center;}
.stat-box .n{font-family:'Chakra Petch',sans-serif;font-size:20px;font-weight:700;color:var(--tera-cyan);}
.stat-box .l{font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.4px;margin-top:3px;}

.title-chip{
  display:inline-block;font-size:11.5px;background:rgba(240,182,79,0.1);border:1px solid rgba(240,182,79,0.3);
  border-radius:20px;padding:4px 11px;margin:0 6px 6px 0;color:var(--tera-amber);font-family:'Chakra Petch',sans-serif;
}

.fav-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:560px){.fav-grid{grid-template-columns:1fr;}}
.fav-list{display:flex;flex-direction:column;gap:6px;}
.fav-row{display:flex;justify-content:space-between;align-items:center;background:var(--bg-card);
  border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px;}
.fav-row .rank{color:var(--text-faint);font-family:'Chakra Petch',sans-serif;font-size:11px;margin-right:8px;}
.fav-row b{color:var(--tera-cyan);}

.fav-set-card{background:var(--bg-card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;}
.fav-set-head{display:flex;align-items:center;justify-content:space-between;font-size:13px;margin-bottom:4px;}
.fav-set-text{background:var(--bg-panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;
  font-family:monospace;font-size:11.5px;white-space:pre-wrap;color:var(--text-dim);max-height:140px;overflow-y:auto;}

@keyframes vsePulseName{
  0%,100%{ opacity:1; }
  50%{ opacity:0.55; }
}
.history-row .res{font-family:'Chakra Petch',sans-serif;font-weight:700;flex-shrink:0;}
.history-row .res.champ{color:var(--tera-amber);}
.history-row .res.elim{color:var(--text-faint);}
</style>
</head>
<body>
<div id="playerCornerContainer"></div>
<div id="authGate" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div class="card" style="max-width:340px;width:100%;margin:0 20px;">
    <h2>Entrar</h2>
    <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Nome</label>
    <select id="gateNameSelect"><option value="">— carregando jogadores —</option></select>
    <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Password</label>
    <input type="password" id="gatePassword" placeholder="A sua password" onkeydown="if(event.key==='Enter') doGateLogin()">
    <button class="btn-primary" onclick="doGateLogin()">Entrar</button>
    <div id="gateError" style="color:var(--danger);font-size:12.5px;margin-top:8px;display:none;"></div>
  </div>
</div>

<div id="topbar" class="topbar" style="display:none;">
  <a href="index.html" class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">Torneio VSE</div>
  </a>
  <nav class="topnav">
    <a href="index.html">Início</a>
    <a href="viewer.html">Bracket</a>
    <a href="estatisticas.html">Estatísticas</a>
    <a href="hall-da-fama.html">Hall da Fama</a>
    <a href="loja.html">Loja</a>
    <a href="conquistas.html">Conquistas</a>
    <a href="palpites.html">Palpiteiro</a>
  </nav>
  <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()" title="Alternar tema claro/escuro" style="position:static;">🌙</button>
</div>

<div id="mainContent" class="wrap" style="display:none;">
  <div class="status-strip">
    <span class="status-dot" id="statusDot"></span>
    <span class="status-text" id="statusText">Conectando…</span>
    <span class="status-text">Ligado como <b id="loggedInNameTop" style="color:var(--tera-cyan);"></b></span>
    <a href="#" class="nav-link" style="margin-left:auto;" onclick="doPlayerLogout(); return false;">Trocar jogador</a>
  </div>

  <div id="profileContent"></div>

  <div class="footer-note">Estatísticas calculadas a partir de todos os torneios guardados na base de dados. Ferramenta feita por fãs, sem afiliação com Nintendo, Game Freak ou The Pokémon Company.</div>
</div>

<script src="showdown-utils.js"></script>
<script>
initTheme();
ensureAvatarFxStyles();
const SUPABASE_URL = "https://irykmyygquytxezevlas.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlyeWtteXlncXV5dHhlemV2bGFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4MTY0ODgsImV4cCI6MjEwMDM5MjQ4OH0.8WfJ_uc4nT1p8tX4fcfYKwdmF7wwL5QGa8KfKyNMSfs";

let loggedInPlayerName = null;

async function doGateLogin(){
  const name = document.getElementById('gateNameSelect').value;
  const password = document.getElementById('gatePassword').value;
  const errEl = document.getElementById('gateError');
  errEl.style.display = 'none';
  if(!name){ errEl.textContent = 'Selecione o seu nome.'; errEl.style.display='block'; return; }
  if(!password){ errEl.textContent = 'Escreva a sua password.'; errEl.style.display='block'; return; }
  const result = await verifyPlayerLogin(SUPABASE_URL, SUPABASE_ANON_KEY, name, password);
  if(!result.ok){
    errEl.textContent = result.reason==='notfound' ? 'Este jogador ainda não foi registrado pelo organizador.'
      : result.reason==='wrongpass' ? 'Password incorreta.'
      : 'Erro ao ligar à base de dados.';
    errEl.style.display = 'block';
    return;
  }
  localStorage.setItem('player_login_name', name);
  loggedInPlayerName = name;
  unlockContent();
}

function unlockContent(){
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('mainContent').style.display = 'block';
  document.getElementById('topbar').style.display = 'flex';
  document.getElementById('loggedInNameTop').textContent = loggedInPlayerName;
  init();
}

function doPlayerLogout(){
  localStorage.removeItem('player_login_name');
  loggedInPlayerName = null;
  document.getElementById('gatePassword').value = '';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('topbar').style.display = 'none';
  document.getElementById('authGate').style.display = 'flex';
}

async function pageBoot(){
  const sel = document.getElementById('gateNameSelect');
  try{
    const names = await fetchRegisteredPlayerNames(SUPABASE_URL, SUPABASE_ANON_KEY);
    sel.innerHTML = '<option value="">— selecione o seu nome —</option>';
    names.forEach(n=>{
      const opt = document.createElement('option');
      opt.value = n; opt.textContent = n;
      sel.appendChild(opt);
    });
    const saved = localStorage.getItem('player_login_name');
    if(saved && names.includes(saved)){
      loggedInPlayerName = saved;
      unlockContent();
    }
  } catch(e){
    sel.innerHTML = '<option value="">— erro ao carregar jogadores —</option>';
  }
}

function sbHeaders(){
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` };
}
function setStatus(ok, text){
  document.getElementById('statusDot').className = 'status-dot ' + (ok?'on':'off');
  document.getElementById('statusText').textContent = text;
}

let dailyBonusClaimInFlight = false;
async function handleDailyBonusClick(){
  // Trava do lado do cliente: ignora cliques repetidos enquanto o pedido
  // anterior ainda está a decorrer, para nem sequer disparar pedidos extra
  // à base de dados (a proteção definitiva está em claimDailyBonus, que já
  // é segura mesmo com vários pedidos em paralelo — isto é só para poupar
  // chamadas desnecessárias e dar feedback visual imediato).
  if(dailyBonusClaimInFlight) return;
  dailyBonusClaimInFlight = true;
  const icon = document.getElementById('dailyBonusIcon');
  if(icon) icon.classList.remove('available');
  try{
    const result = await claimDailyBonus(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName);
    if(result.awarded){
      showCelebrationToast(`🎁 Bônus diário de login: +${result.amount} 🪙<br><span style="font-size:11px;opacity:0.85;">Sequência: dia ${result.streak}${result.streak>=7?' (máximo)':''}</span>`);
    }
  } finally {
    dailyBonusClaimInFlight = false;
  }
}

let allRows = [];
let playerStats = {};
let playerProfiles = {};
let currentTrophies = null;
let eloRatings = {};
let currentH2H = null;
let myCoinTransactions = [];

async function init(){
  try{
    const res = await fetch(`${SUPABASE_URL}/rest/v1/tournaments?select=tier,status,created_at,data&order=created_at.desc`, {headers: sbHeaders()});
    if(!res.ok) throw new Error('HTTP '+res.status);
    allRows = await res.json();
    setStatus(true, `Ligado — ${allRows.length} torneio(s) encontrados.`);
    playerStats = aggregatePlayers(allRows);
    playerProfiles = await fetchPlayerProfiles(SUPABASE_URL, SUPABASE_ANON_KEY);
    currentTrophies = computeCurrentTrophies(allRows);
    eloRatings = computeEloRatings(allRows);
    myCoinTransactions = await fetchCoinTransactions(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName, 30);
    renderProfile();
    checkDailyBonusAvailable(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName).then(available=>{
      document.getElementById('playerCornerContainer').insertAdjacentHTML('beforeend', renderDailyBonusIcon(available));
    });
  } catch(e){
    setStatus(false, 'Não foi possível ligar à base de dados.');
    document.getElementById('profileContent').innerHTML = '<div class="card"><div class="empty-state">Erro ao carregar dados.</div></div>';
  }
}

function getViewedPlayerName(){
  const params = new URLSearchParams(window.location.search);
  const requested = params.get('jogador');
  return requested || loggedInPlayerName;
}

async function renderProfile(){
  const name = getViewedPlayerName();
  const isOwnProfile = name === loggedInPlayerName;
  const container = document.getElementById('profileContent');
  if(!name){ container.innerHTML = ''; return; }

  const st = playerStats[name] || { wins:0, losses:0, titles:0, titlesByTier:{}, tournaments:[] };
  const matchesPlayed = st.wins + st.losses;
  const winrate = matchesPlayed ? Math.round((st.wins/matchesPlayed)*100) : 0;
  const titleChips = Object.entries(st.titlesByTier).map(([tier,c])=>`<span class="title-chip">🏆 ${escapeHtml(tier)} x${c}</span>`).join('');

  const { mons, moves } = aggregatePlayerPokemon(allRows, name);
  const topMons = Object.entries(mons).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const topMoves = Object.entries(moves).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const h2h = computeHeadToHead(allRows, name);
  currentH2H = h2h;
  const eloHistory = computeEloHistory(allRows, name);
  const myStreak = computeAllCurrentStreaks(allRows)[name] || null;
  const seasonComparison = computeSeasonComparison(allRows, name);
  const winrateByTier = computeWinrateByTier(allRows, name);
  const iconicTeam = computeIconicTeam(allRows, name);
  const achievements = await computeAllAchievements(SUPABASE_URL, SUPABASE_ANON_KEY, name, st, myStreak, allRows, playerProfiles[name] || {});
  const favoriteSets = await fetchFavoriteSets(SUPABASE_URL, SUPABASE_ANON_KEY, name);

  if(isOwnProfile){
    checkNewAchievements(SUPABASE_URL, SUPABASE_ANON_KEY, name, achievements).then(newOnes=>{
      newOnes.forEach((id, i)=>{
        const a = ACHIEVEMENTS.find(x=>x.id===id);
        const secretLabel = a && a.secret ? `<br><span style="font-size:11px;opacity:0.85;">🕵️ Esta era uma conquista secreta!</span>` : '';
        if(a) setTimeout(()=> showCelebrationToast(`🎖️ Conquista desbloqueada!<br>${a.emoji} ${escapeHtml(a.name)}${secretLabel}<br><span style="font-size:11.5px;opacity:0.85;">+${ACHIEVEMENT_COIN_BONUS} 🪙</span>`, 6500), i*700);
        if(a && a.secret){
          const shownName = (playerProfiles[name] && playerProfiles[name].nickname) || name;
          postToDiscordFromSite(SUPABASE_URL, SUPABASE_ANON_KEY, `🕵️ **${shownName}** desbloqueou a conquista secreta **${a.emoji} ${a.name}**!`);
        }
      });
    });
  }

  const historyRows = st.tournaments.slice().sort((a,b)=> new Date(b.createdAt) - new Date(a.createdAt)).map(t=>{
    const label = t.name || (t.createdAt ? new Date(t.createdAt).toLocaleDateString('pt-BR') : 'Torneio');
    const cls = t.isChamp ? 'champ' : (t.result.startsWith('Eliminado') ? 'elim' : '');
    const matchLines = (t.matches || []).map(m=>{
      const resultTxt = m.won ? 'Venceu' : 'Perdeu';
      const replayHtml = (m.replayUrls||[]).some(u=>u)
        ? ' · ' + m.replayUrls.map((u,i)=> u ? `<a href="${escapeHtml(u)}" target="_blank" style="color:var(--tera-cyan);text-decoration:none;">▶ ${m.replayUrls.length>1 ? 'jogo '+(i+1) : 'replay'}</a>` : '').join(' ')
        : '';
      return `<div style="font-size:11px;color:var(--text-faint);padding-left:8px;margin-top:2px;">${escapeHtml(m.label)}: ${resultTxt} vs ${escapeHtml(m.opponent)}${replayHtml}</div>`;
    }).join('');
    return `<div class="history-row" style="flex-direction:column;align-items:stretch;gap:2px;">
      <div style="display:flex;justify-content:space-between;">
        <span>${escapeHtml(label)} <span style="color:var(--text-faint);">(${escapeHtml(t.tier)})</span></span>
        <span class="res ${cls}">${t.isChamp?'🏆 ':''}${escapeHtml(t.result)}</span>
      </div>
      ${matchLines}
    </div>`;
  }).join('');

  const initials = name.slice(0,2).toUpperCase();
  const profile = playerProfiles[name] || {};
  const displayName = profile.nickname ? profile.nickname : name;
  const bgCosmetic = profile.equippedBackground ? getCosmeticById(profile.equippedBackground) : null;
  const accentCosmetic = profile.equippedAccent ? getCosmeticById(profile.equippedAccent) : null;
  const accentColor = accentCosmetic ? accentCosmetic.color : 'var(--tera-cyan)';
  const frameCosmetic = profile.equippedFrame ? getCosmeticById(profile.equippedFrame) : null;
  const nameEffectCosmetic = profile.equippedNameEffect ? getCosmeticById(profile.equippedNameEffect) : null;
  const titleCosmetic = profile.equippedTitle ? getCosmeticById(profile.equippedTitle) : null;
  const equippedBadges = (profile.equippedBadges || []).map(id=>getCosmeticById(id)).filter(Boolean);
  const avatar = avatarHtml(name, profile.photo_url, 56, bgCosmetic ? bgCosmetic.color : null, frameCosmetic ? frameCosmetic.effect : null, bgCosmetic ? !!bgCosmetic.multiColor : false);
  const hasCustomPageBg = (profile.ownedCosmetics||[]).includes('feature_custom_pagebg') && profile.profileBackgroundUrl;
  const cardBgStyle = hasCustomPageBg
    ? `background-image:linear-gradient(rgba(10,12,20,0.72),rgba(10,12,20,0.72)),url('${profile.profileBackgroundUrl.replace(/'/g,"\\'")}');background-size:cover;background-position:center;`
    : '';

  container.innerHTML = `
    <div class="card" style="${cardBgStyle}">
      ${!isOwnProfile ? `<div style="margin-bottom:12px;"><a class="nav-link" href="perfil.html">← Ver o meu perfil</a></div>` : ''}
      <div class="profile-head">
        ${avatar}
        <div>
          <div class="profile-name" style="color:${accentColor};${nameEffectCosmetic ? nameEffectCosmetic.css : ''}">${trophyEmojiFor(name, currentTrophies)} ${escapeHtml(displayName)} ${equippedBadges.map(b=>b.emoji).join(' ')}</div>
          ${profile.nickname ? `<div style="font-size:11.5px;color:var(--text-faint);">${escapeHtml(name)}</div>` : ''}
          ${titleCosmetic && titleCosmetic.text ? `<div style="font-size:12px;color:var(--text-dim);margin-top:2px;">${escapeHtml(titleCosmetic.text)}</div>` : ''}
          ${(profile.specialTags||[]).length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;">${(profile.specialTags||[]).map(t=>`<span class="special-tag-chip">${t.emoji} ${escapeHtml(t.text)}</span>`).join('')}</div>` : ''}
          ${trophyEmojiFor(name, currentTrophies) ? `<div class="profile-champion-line">${trophyEmojiFor(name, currentTrophies)} ${currentTrophies.gold===name?'Campeão':currentTrophies.silver===name?'Vice-campeão':'3º lugar'} do último torneio (${escapeHtml(currentTrophies.tier)})</div>` : ''}
          ${st.titles > 0 ? `<div class="profile-champion-line">🏆 ${st.titles} título(s) conquistado(s) no total</div>` : ''}
        </div>
      </div>
      ${profile.status_message ? `<div style="margin-top:12px;padding:10px 14px;background:var(--bg-card);border-left:3px solid ${accentColor};border-radius:6px;font-size:13px;color:var(--text-dim);font-style:italic;">"${escapeHtml(profile.status_message)}"</div>` : ''}
      <div class="stat-grid">
        <div class="stat-box"><div class="n" style="color:var(--tera-amber);">🪙 ${profile.coins || 0}</div><div class="l">Moedas</div></div>
        <div class="stat-box"><div class="n" style="color:var(--tera-amber);">${eloRatings[name] || 1000}</div><div class="l">Elo</div></div>
        <div class="stat-box"><div class="n">${st.tournaments.length}</div><div class="l">Torneios</div></div>
        <div class="stat-box"><div class="n">${st.wins}</div><div class="l">Vitórias</div></div>
        <div class="stat-box"><div class="n">${st.losses}</div><div class="l">Derrotas</div></div>
        <div class="stat-box"><div class="n">${winrate}%</div><div class="l">Winrate</div></div>
      </div>
      ${titleChips ? `<div>${titleChips}</div>` : ''}
      ${isOwnProfile ? `<button class="customize-toggle-btn" onclick="toggleCustomizePanel()">🎨 Customizar</button>` : ''}
    </div>

    <div class="tabs">
      <button class="tab-btn active" onclick="switchProfileTab('estatisticas')">Estatísticas</button>
      <button class="tab-btn" onclick="switchProfileTab('colecao')">Coleção</button>
      <button class="tab-btn" onclick="switchProfileTab('conquistas')">Conquistas</button>
      ${isOwnProfile ? `<button class="tab-btn" onclick="switchProfileTab('conta')">Conta</button>` : ''}
    </div>

    <div class="shop-panel active" id="panel-estatisticas">
    <div class="card">
      <h2>📈 Evolução do Elo</h2>
      ${profile.eloChartUnlocked
        ? buildEloChartSvg(eloHistory)
        : `<div class="empty-state">🔒 Desbloqueie este gráfico na <a class="nav-link" href="loja.html">loja</a> por 🪙${ELO_CHART_PRICE}.</div>`}
    </div>

    <div class="card">
      <h2>Winrate por Tier</h2>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Em qual tier joga melhor — só entram tiers com partidas registadas.</div>
      ${winrateByTier.length ? winrateByTier.map(t=>`
        <div class="history-row"><span><span class="tier-pill">${escapeHtml(t.tier)}</span> ${t.wins}V - ${t.losses}D</span><b style="color:var(--tera-amber);">${t.winrate}%</b></div>
      `).join('') : '<div class="empty-state">Ainda sem partidas registadas.</div>'}
    </div>

    ${seasonComparison.length ? `
    <div class="card">
      <h2>Comparador de Temporadas</h2>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Temporadas de 3 em 3 meses, a contar a partir do primeiro torneio do grupo.</div>
      <div style="overflow-x:auto;">
        <table style="width:100%;border-collapse:collapse;font-size:12.5px;">
          <thead>
            <tr style="border-bottom:1px solid var(--line);text-align:left;color:var(--text-faint);font-size:11px;text-transform:uppercase;letter-spacing:0.5px;">
              <th style="padding:6px 8px;">Temporada</th>
              <th style="padding:6px 8px;">Torneios</th>
              <th style="padding:6px 8px;">V - D</th>
              <th style="padding:6px 8px;">Títulos</th>
              <th style="padding:6px 8px;">Elo médio</th>
            </tr>
          </thead>
          <tbody>
            ${seasonComparison.map(s=>`
              <tr style="border-bottom:1px solid var(--line);">
                <td style="padding:6px 8px;font-weight:700;">Temporada ${s.season}</td>
                <td style="padding:6px 8px;">${s.tournamentsPlayed}</td>
                <td style="padding:6px 8px;">${s.wins}V - ${s.losses}D</td>
                <td style="padding:6px 8px;">${s.titles}</td>
                <td style="padding:6px 8px;color:var(--tera-amber);">${s.avgElo !== null ? s.avgElo : '—'}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
    ` : ''}

    <div class="card">
      <h2>Confrontos & Sequências</h2>
      <div class="stat-grid">
        <div class="stat-box"><div class="n">${h2h.currentStreak ? h2h.currentStreak.count : 0}</div><div class="l">${h2h.currentStreak && h2h.currentStreak.type==='win' ? 'Vitórias seguidas' : 'Derrotas seguidas'}</div></div>
        <div class="stat-box"><div class="n">${h2h.bestTier ? Math.round(h2h.bestTier.winrate*100)+'%' : '—'}</div><div class="l">Melhor tier${h2h.bestTier ? ' ('+escapeHtml(h2h.bestTier.tier)+')' : ''}</div></div>
      </div>
      <div class="fav-grid" style="margin-top:8px;">
        <div class="fav-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <span style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;">😈 Nemesis</span>
          <span>${h2h.nemesis ? `<b>${escapeHtml(h2h.nemesis.name)}</b> — ${h2h.nemesis.losses} derrota(s)` : 'Ainda sem nemesis — bom sinal!'}</span>
        </div>
        <div class="fav-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <span style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;">🎯 Freguês</span>
          <span>${h2h.favoriteVictim ? `<b>${escapeHtml(h2h.favoriteVictim.name)}</b> — ${h2h.favoriteVictim.wins} vitória(s)` : 'Ainda sem freguês.'}</span>
        </div>
        <div class="fav-row" style="flex-direction:column;align-items:flex-start;gap:4px;">
          <span style="font-size:10.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;">🔁 Adversário mais frequente</span>
          <span>${h2h.mostFrequent ? `<b>${escapeHtml(h2h.mostFrequent.name)}</b> — ${h2h.mostFrequent.total} jogo(s)` : 'Sem dados.'}</span>
        </div>
      </div>
      ${Object.keys(h2h.opponents).length ? `
      <details style="margin-top:12px;">
        <summary class="history-toggle">Ver tabela de confrontos completa</summary>
        <div class="history-list">
          ${Object.entries(h2h.opponents).sort((a,b)=>(b[1].wins+b[1].losses)-(a[1].wins+a[1].losses)).map(([opp,rec])=>
            `<div class="history-row"><span>${escapeHtml(opp)}</span><span class="res">${rec.wins}V - ${rec.losses}D</span></div>`
          ).join('')}
        </div>
      </details>` : ''}
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);">
        <label style="display:block;font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Confronto direto</label>
        <select id="compareSelect" onchange="renderCompare()">
          <option value="">— selecione um jogador para comparar —</option>
          ${Object.keys(playerStats).filter(n=>n!==name).sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('')}
        </select>
        <div id="compareResult" style="margin-top:8px;"></div>
      </div>
    </div>

    <div class="card">
      <h2>Histórico de participação</h2>
      ${historyRows || '<div class="empty-state">Sem histórico.</div>'}
    </div>
    </div>

    <div class="shop-panel" id="panel-colecao">
    <div class="card">
      <h2>Favoritos</h2>
      <div class="fav-grid">
        <div>
          <div style="font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Pokémon mais escolhidos</div>
          <div class="fav-list">
            ${topMons.length ? topMons.map(([n,c],i)=>`<div class="fav-row"><span><span class="rank">#${i+1}</span>${escapeHtml(n)}</span><b>${c}x</b></div>`).join('') : '<div class="empty-state">Sem dados.</div>'}
          </div>
        </div>
        <div>
          <div style="font-size:11.5px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Golpes mais usados</div>
          <div class="fav-list">
            ${topMoves.length ? topMoves.map(([n,c],i)=>`<div class="fav-row"><span><span class="rank">#${i+1}</span>${escapeHtml(n)}</span><b>${c}x</b></div>`).join('') : '<div class="empty-state">Sem dados.</div>'}
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>⭐ Equipa Icônica</h2>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">Os 6 Pokémon que mais definem o seu estilo — os mais usados de sempre.</div>
      <div class="shop-grid">
        ${iconicTeam.length ? iconicTeam.map(m=>`
          <div class="shop-item">
            <div class="shop-swatch" style="display:flex;align-items:center;justify-content:center;background:var(--bg-panel);font-size:11px;font-weight:700;">${escapeHtml(m.species)}</div>
            <div class="shop-item-name">${m.count}x usado</div>
          </div>`).join('') : '<div class="empty-state" style="grid-column:1/-1;">Sem dados suficientes ainda.</div>'}
      </div>
    </div>

    <div class="card">
      <h2>📦 Vault de Sets Favoritos</h2>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">${isOwnProfile ? 'Sets que já importou e marcou como favoritos — favorite mais no viewer, junto aos seus sorteios de qualquer torneio.' : `Sets favoritos de ${escapeHtml(displayName)}.`}</div>
      ${favoriteSets.length ? favoriteSets.map(f=>`
        <div class="fav-set-card">
          <div class="fav-set-head">
            <span><b>${f.nickname ? escapeHtml(f.nickname)+' ' : ''}</b><span style="color:var(--text-faint);">${f.nickname ? '('+escapeHtml(f.species)+')' : escapeHtml(f.species)}</span></span>
            ${isOwnProfile ? `<button class="tiny-link" style="background:none;border:none;cursor:pointer;color:var(--danger);" onclick="doRemoveFavoriteSet('${f.id}')">Remover</button>` : ''}
          </div>
          ${f.tournament_name ? `<div style="font-size:10.5px;color:var(--text-faint);margin-bottom:6px;">De: ${escapeHtml(f.tournament_name)}</div>` : ''}
          <div class="fav-set-text" id="fav-set-${f.id}">${escapeHtml(f.set_text)}</div>
          <button class="shop-btn" style="margin-top:6px;" onclick="copyText('fav-set-${f.id}', this)">Copiar</button>
        </div>
      `).join('') : `<div class="empty-state">${isOwnProfile ? 'Ainda não favoritou nenhum set — encontre um nos seus sorteios (em qualquer torneio) e clique em "⭐ Favoritar este set".' : 'Ainda não tem sets favoritos.'}</div>`}
    </div>
    </div>

    <div class="shop-panel" id="panel-conquistas">
    <div class="card">
      <h2>🎖️ Conquistas</h2>
      <div style="font-size:11px;color:var(--text-faint);margin-bottom:10px;">${achievements.size} de ${ACHIEVEMENTS.length} desbloqueadas — sem custar moedas, só por mérito.</div>
      <div class="shop-grid">
        ${(()=>{
          const featuredIds = (profile.featuredAchievements||[]).filter(id=>achievements.has(id));
          if(!featuredIds.length){
            return `<div class="empty-state" style="grid-column:1/-1;">${isOwnProfile ? `Ainda não escolheu conquistas para destacar — escolha em "Ver todas as conquistas" abaixo.` : 'Este jogador ainda não escolheu conquistas para destacar.'}</div>`;
          }
          return ACHIEVEMENTS.filter(a=>featuredIds.includes(a.id)).map(a=>`
            <div class="shop-item" title="${escapeHtml(a.desc)}">
              <div class="shop-swatch" style="display:flex;align-items:center;justify-content:center;background:var(--bg-panel);font-size:22px;">${a.emoji}</div>
              <div class="shop-item-name">${escapeHtml(a.name)}${a.secret ? ' 🕵️' : ''}</div>
            </div>`).join('');
        })()}
      </div>
      <a href="conquistas.html?jogador=${encodeURIComponent(name)}" class="customize-toggle-btn" style="display:inline-block;text-decoration:none;text-align:center;">Ver todas as conquistas${isOwnProfile ? ' e escolher destaques' : ''} →</a>
    </div>
    </div>

    ${isOwnProfile ? `
    <div class="shop-panel" id="panel-conta">
    <div class="card" id="customizePanel" style="display:none;">
      <h2>🎨 Customizar</h2>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">Fundos do avatar</div>
      <div class="shop-grid">${COSMETIC_CATALOG.backgrounds.map(item => customizeItemHtml(item, 'background', profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Cor de destaque</div>
      <div class="shop-grid">${COSMETIC_CATALOG.accents.map(item => customizeItemHtml(item, 'accent', profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Moldura do avatar</div>
      <div class="shop-grid">${COSMETIC_CATALOG.frames.map(item => customizeItemHtml(item, 'frame', profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Efeito no nome</div>
      <div class="shop-grid">${COSMETIC_CATALOG.nameEffects.map(item => customizeItemHtml(item, 'nameEffect', profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Título</div>
      <div class="shop-grid">${COSMETIC_CATALOG.titles.map(item => customizeItemHtml(item, 'title', profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Emblemas (até ${MAX_EQUIPPED_BADGES} ao mesmo tempo)</div>
      <div class="shop-grid">${COSMETIC_CATALOG.badges.map(item => customizeBadgeHtml(item, profile)).join('')}</div>
      <div style="font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:0.5px;margin:16px 0 8px 0;">Fundo de perfil (foto)</div>
      ${customizeBgHtml(profile)}
      <div class="footer-note" style="margin-top:14px;">Não tem o que quer? Visite a <a class="nav-link" href="loja.html">loja</a> para comprar mais.</div>
    </div>

    <div class="card">
      <h2>🧾 Histórico de Transações</h2>
      ${myCoinTransactions.length ? myCoinTransactions.map(t=>{
        const positive = t.amount > 0;
        const dateStr = t.created_at ? new Date(t.created_at).toLocaleDateString('pt-BR') : '';
        return `<div class="history-row"><span>${escapeHtml(t.reason)} <span style="color:var(--text-faint);">(${dateStr})</span></span><span class="res ${positive?'champ':'elim'}">${positive?'+':''}${t.amount} 🪙</span></div>`;
      }).join('') : '<div class="empty-state">Ainda não há transações registadas.</div>'}
    </div>

    <div class="card">
      <h2>Editar o meu perfil</h2>
      <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Apelido (opcional)</label>
      <input type="text" id="editNickname" placeholder="Ex: PeppaPig" value="${escapeHtml(profile.nickname || '')}">
      <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Link da foto de perfil (opcional)</label>
      <input type="text" id="editPhotoUrl" placeholder="Ex: link do teu avatar do Discord" value="${escapeHtml(profile.photo_url || '')}">
      <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">Mensagem de perfil (opcional)</label>
      <input type="text" id="editMessage" placeholder="Ex: Main de Stall, não confiem em mim" value="${escapeHtml(profile.status_message || '')}">
      <label style="display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;">🎂 Aniversário (opcional — sem ano, só para o grupo celebrar contigo)</label>
      <div style="display:flex;gap:8px;">
        <select id="editBirthdayDay" style="flex:1;">
          <option value="">Dia</option>
          ${Array.from({length:31},(_,i)=>i+1).map(d=>`<option value="${d}" ${profile.birthdayDay===d?'selected':''}>${d}</option>`).join('')}
        </select>
        <select id="editBirthdayMonth" style="flex:1;">
          <option value="">Mês</option>
          ${['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'].map((m,i)=>`<option value="${i+1}" ${profile.birthdayMonth===i+1?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" onclick="saveMyProfile()">Guardar</button>
    </div>
    </div>
    ` : ''}
  `;
}

function switchProfileTab(tab){
  document.querySelectorAll('#profileContent .tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('#profileContent .shop-panel').forEach(p=>p.classList.remove('active'));
  const btnMap = {estatisticas:0, colecao:1, conquistas:2, conta:3};
  const btns = document.querySelectorAll('#profileContent .tab-btn');
  if(btns[btnMap[tab]]) btns[btnMap[tab]].classList.add('active');
  const panel = document.getElementById('panel-'+tab);
  if(panel) panel.classList.add('active');
}

async function saveMyProfile(){
  const nickname = document.getElementById('editNickname').value.trim();
  const photoUrl = document.getElementById('editPhotoUrl').value.trim();
  const message = document.getElementById('editMessage').value.trim();
  const birthdayDay = parseInt(document.getElementById('editBirthdayDay').value, 10) || null;
  const birthdayMonth = parseInt(document.getElementById('editBirthdayMonth').value, 10) || null;
  const ok = await updatePlayerProfile(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName, nickname, photoUrl, message, birthdayMonth, birthdayDay);
  if(ok){
    playerProfiles[loggedInPlayerName] = Object.assign({}, playerProfiles[loggedInPlayerName], {
      nickname: nickname || null, photo_url: photoUrl || null, status_message: message || null,
      birthdayMonth: birthdayMonth, birthdayDay: birthdayDay
    });
    renderProfile();
    logActivity(SUPABASE_URL, SUPABASE_ANON_KEY, 'jogador', loggedInPlayerName, 'perfil', `Editou o perfil (apelido: "${nickname||'—'}", mensagem: "${message||'—'}")`);
  } else {
    alert('Não foi possível guardar o perfil. Tente novamente.');
  }
}

async function doRemoveFavoriteSet(id){
  if(!confirm('Remover este set do Vault de favoritos?')) return;
  const result = await removeFavoriteSet(SUPABASE_URL, SUPABASE_ANON_KEY, id);
  if(!result.ok){ alert('Não foi possível remover. Tente novamente.'); return; }
  renderProfile();
}

function toggleCustomizePanel(){
  switchProfileTab('conta');
  const panel = document.getElementById('customizePanel');
  if(panel) panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
}

function customizeItemHtml(item, type, profile){
  const fieldMap = {
    background: profile.equippedBackground, accent: profile.equippedAccent,
    frame: profile.equippedFrame, nameEffect: profile.equippedNameEffect, title: profile.equippedTitle
  };
  const equippedId = fieldMap[type];
  const owned = (item.price === 0 && !item.auctionOnly) || (profile.ownedCosmetics||[]).includes(item.id);
  if(!owned) return ''; // só mostra o que já possui — comprar é na loja
  const equipped = equippedId ? equippedId === item.id : item.price === 0;

  let swatchHtml;
  if(type === 'background') swatchHtml = `<div class="shop-swatch" style="background:${item.css};"></div>`;
  else if(type === 'accent') swatchHtml = `<div class="shop-swatch" style="background:${item.color};"></div>`;
  else if(type === 'frame') swatchHtml = frameEffectPreviewHtml(item.effect);
  else if(type === 'nameEffect') swatchHtml = `<div class="shop-swatch" style="display:flex;align-items:center;justify-content:center;background:var(--bg-panel);color:var(--tera-cyan);font-family:'Chakra Petch',sans-serif;font-weight:700;${item.css}">Abc</div>`;
  else if(type === 'title') swatchHtml = `<div class="shop-swatch" style="display:flex;align-items:center;justify-content:center;background:var(--bg-panel);font-size:11px;padding:4px;">${item.text ? escapeHtml(item.text) : '—'}</div>`;

  const actionBtn = equipped
    ? `<button class="shop-btn" disabled style="opacity:0.5;">Equipado ✓</button>`
    : `<button class="shop-btn" onclick="doEquipCosmetic('${type}','${item.id}')">Usar</button>`;
  return `<div class="shop-item">
    ${swatchHtml}
    <div class="shop-item-name">${escapeHtml(item.name)}</div>
    ${actionBtn}
  </div>`;
}

function customizeBadgeHtml(item, profile){
  const owned = (profile.ownedCosmetics||[]).includes(item.id);
  if(!owned) return '';
  const equipped = (profile.equippedBadges||[]).includes(item.id);
  return `<div class="shop-item">
    <div class="shop-swatch" style="display:flex;align-items:center;justify-content:center;background:var(--bg-panel);font-size:20px;">${item.emoji}</div>
    <div class="shop-item-name">${escapeHtml(item.name)}${equipped?' ✓':''}</div>
    <button class="shop-btn" onclick="doToggleBadge('${item.id}')">${equipped ? 'Remover' : 'Usar'}</button>
  </div>`;
}

function customizeBgHtml(profile){
  const owned = (profile.ownedCosmetics||[]).includes('feature_custom_pagebg');
  if(!owned){
    return `<div class="empty-state" style="text-align:left;padding:4px 0;">Ainda não comprou este item — disponível na <a class="nav-link" href="loja.html">loja</a>.</div>`;
  }
  return `<div style="max-width:340px;">
    <input type="text" id="editProfileBgUrl" placeholder="Link da foto de fundo" value="${escapeHtml(profile.profileBackgroundUrl || '')}">
    <button class="shop-btn" onclick="doSaveProfileBgUrl()">Guardar fundo</button>
  </div>`;
}

async function doEquipCosmetic(type, id){
  const ok = await equipCosmetic(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName, type, id);
  if(ok){
    playerProfiles = await fetchPlayerProfiles(SUPABASE_URL, SUPABASE_ANON_KEY);
    renderProfile();
    document.getElementById('customizePanel').style.display = 'block';
    const item = getCosmeticById(id);
    logActivity(SUPABASE_URL, SUPABASE_ANON_KEY, 'jogador', loggedInPlayerName, 'perfil', `Equipou "${item?item.name:id}"`);
  } else {
    alert('Não foi possível aplicar. Tente novamente.');
  }
}

async function doToggleBadge(badgeId){
  const profile = playerProfiles[loggedInPlayerName] || {};
  const wasEquipped = (profile.equippedBadges||[]).includes(badgeId);
  const result = await toggleBadge(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName, badgeId, profile.equippedBadges || []);
  if(!result.ok){
    if(result.reason === 'limit') alert(`Só pode ter ${MAX_EQUIPPED_BADGES} emblemas equipados ao mesmo tempo. Remova um antes de adicionar outro.`);
    else alert('Não foi possível atualizar. Tente novamente.');
    return;
  }
  playerProfiles = await fetchPlayerProfiles(SUPABASE_URL, SUPABASE_ANON_KEY);
  renderProfile();
  document.getElementById('customizePanel').style.display = 'block';
  const item = getCosmeticById(badgeId);
  logActivity(SUPABASE_URL, SUPABASE_ANON_KEY, 'jogador', loggedInPlayerName, 'perfil', `${wasEquipped?'Removeu':'Equipou'} o emblema "${item?item.name:badgeId}"`);
}

async function doSaveProfileBgUrl(){
  const url = document.getElementById('editProfileBgUrl').value.trim();
  const ok = await setProfileBackgroundUrl(SUPABASE_URL, SUPABASE_ANON_KEY, loggedInPlayerName, url);
  if(ok){
    playerProfiles = await fetchPlayerProfiles(SUPABASE_URL, SUPABASE_ANON_KEY);
    renderProfile();
    document.getElementById('customizePanel').style.display = 'block';
    logActivity(SUPABASE_URL, SUPABASE_ANON_KEY, 'jogador', loggedInPlayerName, 'perfil', `Definiu novo fundo de perfil: ${url || '(removido)'}`);
  } else {
    alert('Não foi possível guardar o fundo. Tente novamente.');
  }
}

function renderCompare(){
  const opponent = document.getElementById('compareSelect').value;
  const resultDiv = document.getElementById('compareResult');
  if(!opponent || !currentH2H){ resultDiv.innerHTML = ''; return; }
  const rec = currentH2H.opponents[opponent];
  if(!rec){
    resultDiv.innerHTML = `<div class="empty-state">Ainda não jogaram um contra o outro.</div>`;
    return;
  }
  const total = rec.wins + rec.losses;
  const winrate = total ? Math.round((rec.wins/total)*100) : 0;
  const myName = getViewedPlayerName();
  resultDiv.innerHTML = `
    <div class="stat-grid">
      <div class="stat-box"><div class="n">${rec.wins}</div><div class="l">Vitórias</div></div>
      <div class="stat-box"><div class="n">${rec.losses}</div><div class="l">Derrotas</div></div>
      <div class="stat-box"><div class="n">${winrate}%</div><div class="l">Winrate</div></div>
    </div>
    <button class="shop-btn" style="margin-top:10px;width:100%;" onclick="downloadHeadToHeadCard('${myName.replace(/'/g,"\\'")}','${opponent.replace(/'/g,"\\'")}',${rec.wins},${rec.losses})">📸 Gerar cartão para partilhar</button>
  `;
}

function downloadHeadToHeadCard(myName, opponent, myWins, myLosses){
  const canvas = generateHeadToHeadCardCanvas(myName, opponent, myWins, myLosses);
  downloadCanvasAsPng(canvas, `confronto-${myName}-vs-${opponent}.png`);
}

pageBoot();
</script>
